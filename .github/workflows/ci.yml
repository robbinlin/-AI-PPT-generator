name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lvs/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress fonts-noto-cjk
      - run: python -m pip install -r workers/parser/requirements.txt pytest
      - run: python -m pytest -q workers/parser
