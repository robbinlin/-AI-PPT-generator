[project]
name = "lvs-tts"
version = "0.1.0"
description = "Lecture Video Studio local TTS worker: open-source Mandarin voice cloning (CosyVoice 2 / GPT-SoVITS / Fish Speech) plus Whisper alignment, on your own GPU"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.23",
  "soundfile>=0.12",
  "faster-whisper>=1.1",
  "opencc-python-reimplemented>=0.1.7",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lvs_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
