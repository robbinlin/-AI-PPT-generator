services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lvs
      POSTGRES_PASSWORD: lvs
      POSTGRES_DB: lvs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lvs
      MINIO_ROOT_PASSWORD: lvs-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata: {}
  miniodata: {}
